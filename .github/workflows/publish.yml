name: Publish to NPM

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # to push the release tag
  id-token: write # for npm provenance

# Never let two releases race each other onto the registry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts, which are an
      # arbitrary-code-execution path during install. Scoped to this command on
      # purpose: setting it globally would also skip our own prepublishOnly
      # gate, which is what re-verifies the package before it ships.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Publishing a version that already exists is a hard error, so a commit
      # that does not bump the version should skip the release, not fail it.
      - name: Decide whether this version needs publishing
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new — releasing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check
        if: steps.check.outputs.publish == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Verify the packed artifact before publishing
        if: steps.check.outputs.publish == 'true'
        run: |
          npm pack
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/ahmetilhn-handy-utils-*.tgz

          cat > smoke.cjs <<'EOF'
          const { isDeepEqual, deepClone } = require("@ahmetilhn/handy-utils");
          if (isDeepEqual(new URL("https://a.com"), new URL("https://b.com"))) {
            throw new Error("isDeepEqual is broken");
          }
          if (!(deepClone(new Map([["a", 1]])) instanceof Map)) {
            throw new Error("deepClone is broken");
          }
          console.log("CJS entry OK");
          EOF

          node smoke.cjs

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.publish }}" = "true" ]; then
            echo "Published ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} is already on npm. Bump the version in package.json to release." >> "$GITHUB_STEP_SUMMARY"
          fi
